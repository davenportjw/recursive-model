steps:
  # 1. Build container image using Google Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$BUILD_ID'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:latest'
      - '.'

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$BUILD_ID'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:latest'

  # 3. Deploy container image to Google Cloud Run with Google Cloud Project Auth (Vertex AI)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$BUILD_ID'
      - '--region'
      - '$_LOCATION'
      - '--platform'
      - 'managed'
      - '--no-iap'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--cpu'
      - '2'
      - '--memory'
      - '2Gi'
      - '--set-env-vars'
      - '^##^GOOGLE_CLOUD_PROJECT=$PROJECT_ID##GOOGLE_CLOUD_REGION=$_LOCATION##GEMINI_LOCATION=global##LOCAL_DEV=false##ALLOWED_EMAIL_DOMAINS=$_ALLOWED_EMAIL_DOMAINS##SESSION_SECRET=$_SESSION_SECRET##BACKEND_SHARED_SECRET=$_BACKEND_SHARED_SECRET'

substitutions:
  _LOCATION: 'us-central1'
  _REPO_NAME: 'tiny-recursive-gemma'
  _SERVICE_NAME: 'tiny-recursive-gemma-web'
  _ALLOWED_EMAIL_DOMAINS: 'google.com,joonix.net,cloudadvocacyorg.joonix.net,davenportjw@cloudadvocacyorg.joonix.net,davenportjw@gmail.com'
  _SESSION_SECRET: 'tiny-recursive-gemma-prod-session-secret-key-32chars!'
  _BACKEND_SHARED_SECRET: 'gemma-recursive-shared-secret-2026'

images:
  - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$BUILD_ID'
  - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:latest'

options:
  logging: CLOUD_LOGGING_ONLY
